name: Integrar e publicar upgrade audiovisual
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Conferir e integrar os 22 arquivos do upgrade
        shell: bash
        run: |
          set -euo pipefail
          package=UPGRADE-MIDIA-2026-10-03.zip
          echo 'cdf0b19d3db517d9eacb782bbbdbc342e003cdb323833833c729f9d59de900f3  UPGRADE-MIDIA-2026-10-03.zip' | sha256sum --check --strict
          files=(MANUTENCAO.md UPGRADE-MIDIA-2026-10-03.md app/acervo/page.tsx app/contato/page.tsx app/cultura/page.tsx app/page.tsx app/privacidade/page.tsx app/refinement.css components/footer.tsx content/projects.ts content/site.ts content/sources.ts tests/static-export.test.mjs components/music-videos.tsx components/tribute-video.tsx components/use-media-playback.ts content/music-videos.ts content/tribute.ts public/images/official/homenagem-imbituba-youtube.jpg public/images/official/turma-da-mare-EczZf3JCFgY.jpg public/images/official/turma-da-mare-gq3BJ_1M11k.jpg public/images/official/turma-da-mare-BcA7YE2Vt9s.jpg)
          all_current=true
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || ! unzip -p "$package" "$file" | cmp -s "$file" -; then
              all_current=false
              break
            fi
          done
          if [ "$all_current" = true ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to overwrite intervening edits in the exact target files.
          git diff --quiet 005feaaf61662f76044e30d502529546a7879c99 HEAD -- "${files[@]}"
          unzip -o "$package" "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Upgrade editorial com homenagem e músicas da Turma da Maré"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
