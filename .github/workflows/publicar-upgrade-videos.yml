name: Integrar e publicar músicas da Turma da Maré
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Conferir e integrar os 17 arquivos da seleção musical
        shell: bash
        run: |
          set -euo pipefail
          package=MUSICAS-2026-10-08.zip
          echo 'd8a6c81f7fe83aa48c3ea8d19daa84359eff33b7b3449825d0e3195fea7b5755  MUSICAS-2026-10-08.zip' | sha256sum --check --strict
          files=(
            MANUTENCAO.md
            MUSICAS-2026-10-08.md
            app/acervo/page.tsx
            app/page.tsx
            app/refinement.css
            components/music-videos.tsx
            content/memory-video.ts
            content/music-videos.ts
            content/projects.ts
            content/sources.ts
            public/images/official/memorias-afetivas-youtube.jpg
            public/images/official/turma-da-mare-MNs9cumpuG4.jpg
            public/images/official/turma-da-mare-NKE_dPCSaS8.jpg
            public/images/official/turma-da-mare-SYe6g2kYT4k.jpg
            public/images/official/turma-da-mare-cr5e8GIuJRY.jpg
            tests/music-assets.test.mjs
            tests/static-export.test.mjs
          )
          # Reject unexpected paths before extraction, including workflow or secret files.
          unzip -Z1 "$package" | sort > "$RUNNER_TEMP/revisao-archive.txt"
          printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/revisao-expected.txt"
          diff -u "$RUNNER_TEMP/revisao-expected.txt" "$RUNNER_TEMP/revisao-archive.txt"
          all_current=true
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || ! unzip -p "$package" "$file" | cmp -s "$file" -; then
              all_current=false
              break
            fi
          done
          if [ "$all_current" = true ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not overwrite intervening changes in the exact target paths.
          git diff --quiet 2a48cac0dcf38c4174e2348e5d2fcb4eca0ee70f HEAD -- "${files[@]}"
          unzip -o "$package" "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Ampliar músicas da Turma da Maré com Memórias Afetivas e quatro Shorts"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verificar endereço raiz
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node -e "if(new URL(process.env.BASE_URL).pathname.replaceAll('/','')) throw new Error('Esta edição requer hospedagem na raiz do domínio.')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
