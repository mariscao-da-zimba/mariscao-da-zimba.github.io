name: Aplicar e publicar revisão visual
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Aplicar somente os oito arquivos revisados
        shell: bash
        run: |
          set -euo pipefail
          if [ -f REVISAO-VISUAL.md ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=(app/butiazinho.css app/refinement.css components/butiazinho-feature.tsx components/motion-effects.tsx components/site-header.tsx package-lock.json tests/static-export.test.mjs REVISAO-VISUAL.md)
          git diff --quiet fd993c2efac0e204f8af7b26e7dfddd1f310a376 HEAD -- "${files[@]}"
          echo '27ebf9edf606c2e81293c21dea0471a0e997c71aa2aa7b030d62928f824a1e8e  REVISAO-VISUAL-2026-09-13.zip' | sha256sum --check --strict
          unzip -o REVISAO-VISUAL-2026-09-13.zip "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Refinar visual, acessibilidade e desempenho do portal"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
