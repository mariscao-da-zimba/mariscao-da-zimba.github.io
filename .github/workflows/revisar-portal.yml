name: Aplicar e publicar revisão completa
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Conferir e integrar os 31 arquivos auditados
        shell: bash
        run: |
          set -euo pipefail
          package=CORRECOES-2026-10-08.zip
          echo '5e7303c73b4a6aba9550816bc78fcde08d13e32e01f023beb6e970ba42990532  CORRECOES-2026-10-08.zip' | sha256sum --check --strict
          files=(
            .gitignore
            CORRECOES-2026-10-08.md
            MANUTENCAO.md
            app/acervo/page.tsx
            app/agenda/page.tsx
            app/caminho-dos-butiazais/page.tsx
            app/educacao-ambiental/page.tsx
            app/fontes/page.tsx
            app/minimal.css
            app/page.tsx
            app/refinement.css
            components/contact-form.tsx
            components/contact-message.ts
            components/ui.tsx
            content/events.ts
            content/guide-document.json
            content/guide-text-overrides.json
            content/highlights.ts
            content/projects.ts
            content/site.ts
            content/sources.ts
            content/types.ts
            package-lock.json
            package.json
            public/documentos/guia-caminho-dos-butiazais.pdf
            scripts/ocr-guide.mjs
            scripts/restore-guide-text.py
            scripts/verify-guide.py
            tests/content-regressions.test.mjs
            tests/guide-document.test.mjs
            tests/ui-regressions.test.mjs
          )
          # Reject unexpected paths before extraction, including workflow or secret files.
          unzip -Z1 "$package" | sort > "$RUNNER_TEMP/revisao-archive.txt"
          printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/revisao-expected.txt"
          diff -u "$RUNNER_TEMP/revisao-expected.txt" "$RUNNER_TEMP/revisao-archive.txt"
          all_current=true
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || ! unzip -p "$package" "$file" | cmp -s "$file" -; then
              all_current=false
              break
            fi
          done
          if [ "$all_current" = true ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not overwrite intervening changes in the exact target paths.
          git diff --quiet 5e10bed31de1cfefd279688c55f152e626942ffa HEAD -- "${files[@]}"
          unzip -o "$package" "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Corrigir conteúdo, links, contraste, contato e busca no guia após auditoria"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verificar endereço raiz
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node -e "if(new URL(process.env.BASE_URL).pathname.replaceAll('/','')) throw new Error('Esta edição requer hospedagem na raiz do domínio.')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
