name: Aplicar e publicar correções finais
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Conferir e integrar os 11 arquivos corrigidos
        shell: bash
        run: |
          set -euo pipefail
          package=CORRECOES-2026-10-09.zip
          echo '65188d9d65f1d46e0c6d3b97a3c6fac0bfea76cf7228e8644986cd11b24aa618  CORRECOES-2026-10-09.zip' | sha256sum --check --strict
          files=(
            CORRECOES-2026-10-09.md
            MANUTENCAO.md
            app/experience.css
            app/memoria/page.tsx
            app/privacidade/page.tsx
            app/refinement.css
            components/culture-ribbon.tsx
            components/motion-effects.tsx
            tests/dark-heading-contrast.test.mjs
            tests/motion-effects.test.mjs
            tests/privacy-memory.test.mjs
          )
          # Reject unexpected paths before extraction, including workflow or secret files.
          unzip -Z1 "$package" | sort > "$RUNNER_TEMP/revisao-archive.txt"
          printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/revisao-expected.txt"
          diff -u "$RUNNER_TEMP/revisao-expected.txt" "$RUNNER_TEMP/revisao-archive.txt"
          all_current=true
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || ! unzip -p "$package" "$file" | cmp -s "$file" -; then
              all_current=false
              break
            fi
          done
          if [ "$all_current" = true ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not overwrite intervening changes in the exact target paths.
          git diff --quiet 630471db492f9537acbc528cac14d668111d296d HEAD -- "${files[@]}"
          unzip -o "$package" "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Corrigir contraste, memória, privacidade e persistência dos efeitos visuais"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verificar endereço raiz
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node -e "if(new URL(process.env.BASE_URL).pathname.replaceAll('/','')) throw new Error('Esta edição requer hospedagem na raiz do domínio.')"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
