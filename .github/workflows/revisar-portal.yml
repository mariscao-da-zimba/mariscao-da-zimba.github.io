name: Publicar ajustes de SEO e controle de seguranca
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: update
        name: Conferir 16 arquivos e integrar os 11 arquivos de fonte
        shell: bash
        run: |
          set -euo pipefail
          package=SEO-SEGURANCA-2026-10-09.zip
          echo 'f31e9014371c147e96f6b34bcf3504d7ae10e3d17125601a32ede78e7c81f6c9  SEO-SEGURANCA-2026-10-09.zip' | sha256sum --check --strict
          files=(
            '.github/workflows/ampliar-praias-video.yml'
            '.github/workflows/atualizar-butiazinho.yml'
            '.github/workflows/pages.yml'
            '.github/workflows/publicar-praias-video.yml'
            '.github/workflows/publicar-upgrade-videos.yml'
            'AJUSTES-SEO-SEGURANCA-2026-10-09.md'
            'MANUTENCAO.md'
            'SECURITY.md'
            'app/caminho-dos-butiazais/page.tsx'
            'app/projetos/[slug]/page.tsx'
            'content/sources.ts'
            'package.json'
            'scripts/audit-dependencies.mjs'
            'scripts/dependency-audit-policy.mjs'
            'tests/dependency-audit-policy.test.mjs'
            'tests/editorial-seo.test.mjs'
          )
          # Only the exact reviewed paths are allowed, including five scoped CI edits.
          unzip -Z1 "$package" | sort > "$RUNNER_TEMP/revisao-archive.txt"
          printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/revisao-expected.txt"
          diff -u "$RUNNER_TEMP/revisao-expected.txt" "$RUNNER_TEMP/revisao-archive.txt"
          stage=$(mktemp -d "$RUNNER_TEMP/mariscao-revisao.XXXXXX")
          # Extract to staging without filename patterns: [slug] must remain literal.
          unzip -q "$package" -d "$stage"
          source_files=()
          for file in "${files[@]}"; do
            if [[ "$file" == .github/workflows/* ]]; then
              # GITHUB_TOKEN cannot edit workflows. They must already match the UI-reviewed files.
              if [ ! -f "$file" ] || ! cmp -s <(sed 's/\r$//' "$stage/$file") <(sed 's/\r$//' "$file"); then
                echo "Workflow ainda não corresponde ao arquivo revisado: $file"
                exit 1
              fi
            else
              source_files+=("$file")
            fi
          done
          all_current=true
          for file in "${files[@]}"; do
            if [ ! -f "$file" ] || ! cmp -s <(sed 's/\r$//' "$stage/$file") <(sed 's/\r$//' "$file"); then
              all_current=false
              break
            fi
          done
          if [ "$all_current" = true ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not overwrite intervening changes in the exact target paths.
          git --literal-pathspecs diff --quiet 5eff6f3a5c7ad47f00d4bcdd2f5c0929e25f890f HEAD -- "${source_files[@]}"
          for file in "${source_files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp -- "$stage/$file" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --literal-pathspecs add -- "${source_files[@]}"
          git commit -m "Corrigir redação e SEO e adicionar controle explícito dos alertas de desenvolvimento"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: importar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.importar.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verificar endereço raiz
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node -e "if(new URL(process.env.BASE_URL).pathname.replaceAll('/','')) throw new Error('Esta edição requer hospedagem na raiz do domínio.')"
      - run: npm ci
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
